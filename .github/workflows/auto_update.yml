name: Myaista Self-Evolution & Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Self-Evolution Script
        run: python update_log.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Myaista Bot"
          git config --global user.email "bot@myaista.local"
          git add data/log.json index.html
          # 変更がない場合でも強制的にコミットを通すための処理
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Myaista self-evolution: updated log & view"
          git push origin main
