name: Myaista Self-Evolution & Deploy

on:
  schedule:
    - cron: '0 0 * * *' # 毎日1回自動実行
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Self-Evolution Script
        run: python update_log.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Myaista Bot"
          git config --global user.email "bot@myaista.local"
          git add data/log.json index.html
          git commit -m "🤖 Myaista self-evolution: updated log & view" || exit 0
          git push
